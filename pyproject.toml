[project]
name = "omnivoice-toolkit"
version = "0.2.0"
description = "OmniVoice 配音工具（模板化重构）：GGUF 语音克隆 / 声音设计 / 自动音色 / ASR 转写；核心层模型无关，可作未来生成模型参考模板"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "soundfile",
    "huggingface_hub",
    # Web 界面（设置见 src/settings.py 顶部变量）
    "gradio==6.24.0",
]
